<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fingers Of Steel® Publications</title>
  <meta name="description" content="Fingers Of Steel® is Folkcraft Instruments' publishing imprint: mountain dulcimer instruction books and songbooks by today's leading players and teachers.">
  <link rel="icon" type="image/png" href="images/fingers-of-steel-logo.png">
  <link rel="canonical" href="https://fingersofsteel.com/">
  <style>
    :root {
      --ink: #2b2b2b;
      --muted: #666;
      --line: #e3e0d8;
      --bg: #fff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 17px;
      line-height: 1.5;
    }
    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 16px 48px;
    }
    h1 {
      margin: 0 0 24px;
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      font-weight: normal;
      letter-spacing: 0.01em;
    }
    a { color: #3b6b2a; }
    footer {
      margin-top: 48px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.875rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>Fingers Of Steel® Publications</h1>
<!--FOS-BODY-->
    <footer>
      Fingers Of Steel&reg; is a registered trademark and publishing imprint of
      <a href="https://folkcraft.com">Folkcraft Instruments</a>.
    </footer>
  </div>
</body>
</html>
