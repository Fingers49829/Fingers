<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fingers Of Steel® Publications</title>
  <meta name="description" content="Fingers Of Steel® is Folkcraft Instruments' publishing imprint: mountain dulcimer instruction books and songbooks by today's leading players and teachers.">
  <link rel="icon" type="image/png" href="/images/fingers-of-steel-logo.png">
  <link rel="canonical" href="https://fingersofsteel.com/">
  <style>
    :root {
      --ink: #2b2b2b;
      --muted: #666;
      --line: #e3e0d8;
      --bg: #fff;
      --accent: #1f4e79;
      --accent-dark: #173b5c;
      --parchment: #f3f1ea;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 17px;
      line-height: 1.5;
    }
    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 16px 48px;
    }
    h1 {
      margin: 0 0 24px;
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      font-weight: normal;
      letter-spacing: 0.01em;
    }
    a { color: var(--accent); }

    /* Book page header: parchment bar with the logo, name and tagline, and links back to the catalog */
    .masthead { background: var(--parchment); border-bottom: 4px solid var(--accent); }
    .masthead-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }
    .masthead .brand { color: var(--ink); text-decoration: none; display: flex; align-items: center; gap: 14px; min-width: 0; }
    .masthead .brand img { height: 64px; width: auto; }
    .masthead .name { display: block; font-size: 1.45rem; line-height: 1.15; }
    .masthead .tag { display: block; color: var(--accent); font-size: 0.95rem; margin-top: 2px; }
    .masthead nav { display: flex; gap: 8px; font-family: "Segoe UI", Arial, sans-serif; font-size: 0.88rem; font-weight: 600; }
    .masthead nav a { color: var(--accent); text-decoration: none; padding: 8px 14px; border: 1.5px solid var(--accent); border-radius: 6px; white-space: nowrap; }
    .masthead nav a.primary { background: var(--accent); color: #fff; }
    .masthead nav a:hover { background: var(--accent-dark); border-color: var(--accent-dark); color: #fff; }
    @media (max-width: 640px) {
      .masthead-inner { flex-direction: column; align-items: stretch; gap: 12px; }
      .masthead .brand img { height: 52px; }
      .masthead .name { font-size: 1.2rem; }
      .masthead .tag { font-size: 0.85rem; }
      .masthead nav a { flex: 1; text-align: center; }
    }

    /* Book pages */
    .book {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(0, 3fr);
      gap: 40px;
      align-items: start;
    }
    .book-cover {
      width: 100%;
      height: auto;
      border: 1px solid var(--line);
    }
    .book-thumbs {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-top: 8px;
    }
    .book-thumbs img {
      width: 100%;
      height: auto;
      aspect-ratio: 1;
      object-fit: cover;
      border: 1px solid var(--line);
    }
    .book-title {
      margin: 0;
      font-size: clamp(1.5rem, 3.5vw, 2.1rem);
      font-weight: normal;
      line-height: 1.2;
    }
    .book-author { margin: 6px 0 24px; color: var(--muted); font-size: 1.1rem; }
    .buy-links {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .buy {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 14px 18px;
      border-radius: 6px;
      text-decoration: none;
      color: #fff;
      background: var(--accent);
    }
    .buy:hover { background: var(--accent-dark); }
    .buy-pdf { background: #2b2b2b; }
    .buy-pdf:hover { background: #000; }
    .buy strong { font-size: 1.05rem; }
    .buy span { font-size: 0.9rem; opacity: 0.9; }
    .book-isbn { margin: 0 0 24px; color: var(--muted); font-size: 0.9rem; }
    .book-desc { border-top: 1px solid var(--line); padding-top: 20px; }
    .book-desc img, .book-desc iframe { max-width: 100%; height: auto; }
    @media (max-width: 720px) {
      .book { grid-template-columns: 1fr; gap: 24px; }
      .book-gallery { max-width: 420px; }
    }
    footer {
      margin-top: 48px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.875rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>Fingers Of Steel® Publications</h1>
<!--FOS-BODY-->
    <footer>
      Copyright &copy; 2026 Fingers Of Steel
    </footer>
  </div>
  <script>
    // "By author" links land on /#fos-tab-author; switch the homepage's catalog to that tab.
    if (location.hash === '#fos-tab-author') {
      const tab = document.getElementById('fos-tab-author');
      if (tab) tab.checked = true;
    }
  </script>
</body>
</html>
