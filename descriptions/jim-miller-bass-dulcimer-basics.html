<p><em>Bass Dulcimer Basics</em> by Jim Miller teaches you to play the bass dulcimer the way a bass guitarist plays bass. It covers:</p>
<ul>
  <li>Alternating bass, bass runs and walking bass</li>
  <li>Boogie woogie, blues and shuffle</li>
  <li>Doo wop, swing, waltz and jigs</li>
</ul>
<p>Tablature for nine tunes gets you started.</p>
<p>21 pages.</p>
