<p>Subtitled "A unique collection of carols," Larry Conger's <em>Christmas With The Dulcimer</em> offers superb mountain dulcimer arrangements of a wide variety of Christmas carols.</p>
<p>It's fun to play, and it makes a great Christmas gift for dulcimer-playing friends and family.</p>
<p>32 pages.</p>
