<p><em>Christmas Duets For Mountain Dulcimer</em> is a collection of Christmas duets arranged by Larry Conger, known for his vast repertoire, playable arrangements and delicate touch.</p>
<p>Some of his best work is here. The set includes two books, one for each player.</p>
<p>32 pages each (64 pages total).</p>
