<p><em>Hymns Of Faith For Mountain Dulcimer</em> features Larry Conger's mountain dulcimer arrangements of beloved hymns.</p>
<p>You'll find famous classics such as "Abide With Me" and "Just As I Am" alongside lesser-known hymns like "O Worship The King" and "Sunshine In My Soul."</p>
<p>32 pages.</p>
