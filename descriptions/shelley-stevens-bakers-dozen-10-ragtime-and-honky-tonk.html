<p><em>Baker's Dozen #10: Ragtime And Honky Tonk</em> by Shelley Stevens arranges 13 classic American ragtime tunes for mountain dulcimer, including favorites by Scott Joplin and Hughie Cannon.</p>
<p>It's a fun, quirky collection, and every arrangement includes standard notation and dulcimer tablature.</p>
<p>20 pages.</p>
