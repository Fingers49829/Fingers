<p><em>I Celebrate Life!</em> is a book/CD set of original songs and tunes for mountain dulcimer and hammered dulcimer, spanning the first 25 years of Steve Eulberg's music.</p>
<p>It moves from a boot-kicking hoedown through relaxing interludes to jigs and waltzes.</p>
<p>84 pages.</p>
