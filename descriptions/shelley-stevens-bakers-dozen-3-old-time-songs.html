<p><em>Baker's Dozen #3: Old Time Songs</em> collects 13 old-time songs for mountain dulcimer, arranged by Shelley Stevens, including "Poor Ellen Smith" and "Bury Me Beneath The Willow."</p>
<p>All songs are in DAD tuning, with standard notation, dulcimer tablature and lyrics.</p>
<p>22 pages.</p>
