<p><em>Baker's Dozen #5: Dulci-Merry Christmas 1</em> brings 13 Christmas classics to the mountain dulcimer in Shelley Stevens' popular Baker's Dozen series.</p>
<p>Every arrangement uses DAD, an easy tuning to play in, and is written out in both standard notation and tab.</p>
<p>23 pages.</p>
