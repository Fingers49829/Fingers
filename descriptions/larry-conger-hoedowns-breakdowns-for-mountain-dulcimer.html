<p><em>Hoedowns &amp; Breakdowns For Mountain Dulcimer</em> is Larry Conger's collection of dance tunes for mountain dulcimer, with great melodies and danceable rhythms.</p>
<p>There are very few crooked tunes here, just lots of fun music for your dulcimer library.</p>
<p>32 pages.</p>
