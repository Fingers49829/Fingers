<p><em>Simply Remembered</em> arranges over 20 old-time songs for mountain dulcimer, part of Maureen Sellers' "Simply" series for novice to intermediate players.</p>
<ul>
  <li>All songs in DAD tuning; some use a capo</li>
  <li>Standard notation and tablature, with lyrics and chords</li>
  <li>Author's notes on every song</li>
</ul>
<p>58 pages.</p>
