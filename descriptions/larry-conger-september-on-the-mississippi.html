<p><em>September On The Mississippi</em> is named for Larry Conger's signature tune, a favorite every time it's played. This mountain dulcimer collection includes "September" plus 19 more of Larry's arrangements.</p>
<p>Most songs are in DAD tuning, with one in DAA and one in DGD. Some songs use a capo.</p>
<p>32 pages.</p>
